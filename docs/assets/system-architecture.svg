<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">SciForge system architecture</title>
  <desc id="desc">Local browser and FastAPI application coordinate project persistence, scientific engines, optional model and TTS services, and generated artifacts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5bc6ae"/></marker>
    <style>
      .sans{font-family:Inter,Segoe UI,sans-serif}.title{font-size:29px;font-weight:700;fill:#f5f4eb}.subtitle{font-size:14px;fill:#9eb2ac}.box{fill:#183136;stroke:#4c766b;stroke-width:1.4}.external{fill:#332e25;stroke:#c18f4f;stroke-width:1.4}.store{fill:#242f34;stroke:#82918b;stroke-width:1.3}.head{font-size:16px;font-weight:700;fill:#f5f4eb}.text{font-size:12px;fill:#b2c1bc}.tag{font-size:11px;letter-spacing:1px;fill:#67d3b6}.edge{fill:none;stroke:#5bc6ae;stroke-width:2;marker-end:url(#arrow)}.optional{fill:none;stroke:#d6a154;stroke-width:1.7;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" rx="18" fill="#101b20"/>
  <text x="48" y="58" class="sans title">SciForge / runtime architecture</text>
  <text x="48" y="86" class="sans subtitle">Current single-user local topology. Solid lines are application data flow; dashed lines are optional external services.</text>

  <rect x="34" y="122" width="1132" height="586" rx="18" fill="#132327" stroke="#344a47" stroke-width="1.5"/>
  <text x="58" y="155" class="sans tag">LOCAL HOST / LOOPBACK HTTP</text>

  <rect x="72" y="204" width="218" height="102" rx="12" class="box"/>
  <text x="92" y="234" class="sans tag">INTERACTION</text><text x="92" y="262" class="sans head">Browser UI</text><text x="92" y="284" class="sans text">HTML · CSS · JavaScript</text>

  <rect x="360" y="204" width="230" height="102" rx="12" class="box"/>
  <text x="380" y="234" class="sans tag">CONTROL PLANE</text><text x="380" y="262" class="sans head">FastAPI application</text><text x="380" y="284" class="sans text">REST · polling · pipeline worker</text>

  <rect x="660" y="180" width="445" height="278" rx="14" fill="#172a2c" stroke="#55766c" stroke-width="1.4"/>
  <text x="684" y="210" class="sans tag">DETERMINISTIC ENGINE BOUNDARY</text>
  <rect x="686" y="234" width="184" height="76" rx="10" class="box"/><text x="704" y="261" class="sans head">Ingestion</text><text x="704" y="285" class="sans text">PyMuPDF · Tesseract OCR</text>
  <rect x="894" y="234" width="184" height="76" rx="10" class="box"/><text x="912" y="261" class="sans head">Knowledge graph</text><text x="912" y="285" class="sans text">Source text · graph IR</text>
  <rect x="686" y="338" width="184" height="76" rx="10" class="box"/><text x="704" y="365" class="sans head">Simulation</text><text x="704" y="389" class="sans text">NumPy · SciPy · metrics</text>
  <rect x="894" y="338" width="184" height="76" rx="10" class="box"/><text x="912" y="365" class="sans head">Lecture director</text><text x="912" y="389" class="sans text">Validated LecturePlan IR</text>

  <rect x="360" y="362" width="230" height="102" rx="12" class="store"/>
  <text x="380" y="392" class="sans tag">PERSISTENCE</text><text x="380" y="420" class="sans head">Project JSON</text><text x="380" y="442" class="sans text">Progress · plan · review overrides</text>

  <rect x="660" y="516" width="445" height="126" rx="14" fill="#202b2e" stroke="#74837c" stroke-width="1.4"/>
  <text x="684" y="546" class="sans tag">OUTPUTS / outputs/{project_id}/</text>
  <text x="688" y="578" class="sans head">Narration + captions</text><text x="688" y="603" class="sans text">Edge-TTS · WebVTT</text>
  <text x="902" y="578" class="sans head">Render + export</text><text x="902" y="603" class="sans text">HTML · TeX · PNG · FFmpeg MP4</text>

  <rect x="72" y="524" width="218" height="104" rx="12" class="external"/>
  <text x="92" y="554" class="sans tag">OPTIONAL PROVIDER</text><text x="92" y="582" class="sans head">LLM router</text><text x="92" y="606" class="sans text">Anthropic · OpenAI · xAI · Ollama</text>

  <rect x="360" y="524" width="230" height="104" rx="12" class="external"/>
  <text x="380" y="554" class="sans tag">ONLINE SERVICE</text><text x="380" y="582" class="sans head">Edge-TTS</text><text x="380" y="606" class="sans text">Synthetic fallback for offline tests</text>

  <path d="M290 255H350" class="edge"/><path d="M590 255H650" class="edge"/>
  <path d="M475 306V352" class="edge"/><path d="M590 411H650" class="edge"/>
  <path d="M782 310V328" class="edge"/><path d="M870 272H884" class="edge"/><path d="M870 376H884" class="edge"/>
  <path d="M986 414V506" class="edge"/><path d="M782 414V506" class="edge"/>
  <path d="M290 576H350" class="optional"/><path d="M590 576H650" class="optional"/>
  <path d="M72 255H54V411H350" fill="none" stroke="#5bc6ae" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
  <text x="48" y="688" class="sans text">Trust note: simulation execution currently uses in-process exec(); keep the service local and never expose it to untrusted users.</text>
</svg>